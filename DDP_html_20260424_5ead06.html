<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>国际物流报价助手 | CIF/DDP 智能计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f1f5f9;
            padding: 30px 24px 48px;
            color: #0f172a;
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部 */
        .header {
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e3c72, #2b4c7c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .header p {
            color: #475569;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* 双栏布局: 左侧表单区 + 右侧记录区 */
        .dashboard {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        /* 左侧报价表单卡片 */
        .quote-form {
            flex: 2;
            min-width: 320px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 右侧历史记录卡片 */
        .history-panel {
            flex: 1.3;
            min-width: 300px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 通用卡片内边距 */
        .card-header {
            padding: 1.2rem 1.5rem;
            background: #ffffff;
            border-bottom: 1px solid #e9eef3;
        }

        .card-header h2 {
            font-size: 1.35rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header h2 i {
            font-size: 1.3rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* 表单分组样式 */
        .form-section {
            margin-bottom: 1.8rem;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 1rem;
        }

        .form-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .section-title {
            font-weight: 600;
            font-size: 1rem;
            color: #1e293b;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 40px;
            width: fit-content;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 1.2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #334155;
            letter-spacing: 0.3px;
        }

        .input-group input {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.9rem;
            transition: 0.2s;
            background: #fff;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2b6e9e;
            box-shadow: 0 0 0 3px rgba(43, 110, 158, 0.2);
        }

        .inline-hint {
            font-size: 0.7rem;
            color: #62748c;
            margin-top: 2px;
        }

        /* 报价类型切换 */
        .toggle-group {
            display: flex;
            gap: 18px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 60px;
            width: fit-content;
            margin-bottom: 1rem;
        }

        .toggle-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            cursor: pointer;
        }

        /* 关税区域 (动态) */
        .duty-area {
            background: #fefce8;
            border-radius: 18px;
            padding: 0.8rem 1rem;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }

        /* 预览报价栏 */
        .preview-card {
            background: linear-gradient(105deg, #eef2ff 0%, #e6edfc 100%);
            border-radius: 24px;
            padding: 1rem 1.3rem;
            margin: 1rem 0 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .preview-label {
            font-weight: 500;
            color: #1e293b;
        }

        .preview-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f3b5e;
            letter-spacing: -0.5px;
        }

        .btn-save {
            background: #0f3b5e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:hover {
            background: #1e4c72;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        /* 记录列表 */
        .record-list {
            flex: 1;
            overflow-y: auto;
            max-height: 520px;
            padding: 0 0.2rem 0.5rem 0;
        }

        .record-item {
            background: #fafcff;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 12px;
            border: 1px solid #eef2f8;
            transition: 0.1s;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .record-type {
            font-weight: 700;
            background: #e2e8f0;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            color: #1f4662;
        }

        .record-date {
            font-size: 0.7rem;
            color: #5b6e8c;
        }

        .record-amount {
            font-size: 1.25rem;
            font-weight: 800;
            color: #155e75;
            margin: 6px 0 4px;
        }

        .record-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            color: #4b6b8f;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.1s;
        }

        .icon-btn:hover {
            background: #eef2ff;
            color: #0f3b5e;
        }

        .empty-record {
            text-align: center;
            color: #94a3b8;
            padding: 40px 20px;
        }

        .clear-btn {
            background: #f1f5f9;
            border: 1px solid #cddfe7;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 500;
            margin-top: 12px;
            width: 100%;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 500px;
            width: 90%;
            border-radius: 32px;
            padding: 1.6rem;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-bottom: 1rem;
        }
        .detail-grid {
            font-size: 0.85rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 6px 10px;
            margin-top: 10px;
        }
        .close-modal {
            float: right;
            background: #eef2ff;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
        }

        @media (max-width: 780px) {
            body { padding: 20px 16px; }
            .grid-2col { grid-template-columns: 1fr; }
            .preview-price { font-size: 1.4rem; }
        }
        hr {
            margin: 10px 0;
            border-color: #eef2f8;
        }
        .badge {
            font-size: 0.7rem;
            background: #eef2ff;
            border-radius: 30px;
            padding: 2px 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📦 跨境报价专家 · CIF / DDP</h1>
        <p>精准核算成本 | 一键记录报价 | 历史随时追溯</p>
    </div>

    <div class="dashboard">
        <!-- 左侧报价表单 -->
        <div class="quote-form">
            <div class="card-header">
                <h2>📝 参数配置</h2>
            </div>
            <div class="card-body">
                <!-- 报价类型切换 -->
                <div class="toggle-group">
                    <label>
                        <input type="radio" name="quoteType" value="CIF" checked> 🚢 CIF 报价
                    </label>
                    <label>
                        <input type="radio" name="quoteType" value="DDP"> 🏭 DDP 报价 (完税交货)
                    </label>
                </div>

                <!-- 货物成本 & 国际费用 -->
                <div class="form-section">
                    <div class="section-title">💰 基础成本</div>
                    <div class="grid-2col">
                        <div class="input-group">
                            <label>货物总成本 (采购/出厂价) ¥</label>
                            <input type="number" id="goodsCost" value="25000" step="100" placeholder="金额">
                        </div>
                        <div class="input-group">
                            <label>国际海空运费 ¥</label>
                            <input type="number" id="freight" value="3200" step="100" placeholder="运费">
                        </div>
                        <div class="input-group">
                            <label>保险费金额 ¥</label>
                            <input type="number" id="insurance" value="380" step="50" placeholder="保险费用">
                        </div>
                    </div>
                </div>

                <!-- 国内费用细分 (工厂/港口/机场/拖车/报关/文件/港杂) -->
                <div class="form-section">
                    <div class="section-title">🚛 国内总费用 · 细分项</div>
                    <div class="grid-2col">
                        <div class="input-group"><label>🏭 工厂→港口/机场</label><input type="number" id="factoryToPort" value="800" step="50"></div>
                        <div class="input-group"><label>✈️ 机场操作费</label><input type="number" id="airportFee" value="0" step="50"></div>
                        <div class="input-group"><label>🚛 拖车费</label><input type="number" id="trucking" value="1200" step="100"></div>
                        <div class="input-group"><label>📄 报关费</label><input type="number" id="customsFee" value="350" step="30"></div>
                        <div class="input-group"><label>📁 文件费</label><input type="number" id="documentFee" value="200" step="20"></div>
                        <div class="input-group"><label>⚓ 港杂费/THC等</label><input type="number" id="portSurcharge" value="500" step="50"></div>
                    </div>
                    <div class="inline-hint" style="margin-top: 8px;">✅ 国内总费用 = 以上六项自动合计</div>
                </div>

                <!-- 关税增值税区域 (DDP时显示) -->
                <div class="form-section" id="dutySection" style="display: none;">
                    <div class="section-title">🛃 进口环节税金 (DDP)</div>
                    <div class="grid-2col">
                        <div class="input-group"><label>进口关税税率 (%)</label><input type="number" id="importDutyRate" value="8" step="0.5"></div>
                        <div class="input-group"><label>进口增值税税率 (%)</label><input type="number" id="importVatRate" value="13" step="0.5"></div>
                    </div>
                    <div class="inline-hint">※ 关税 = (CIF货值) × 关税率；增值税 = (CIF货值+关税) × 增值税率</div>
                </div>

                <!-- 利润率 -->
                <div class="form-section">
                    <div class="section-title">📈 利润设置</div>
                    <div class="input-group">
                        <label>预期利润率 (%)</label>
                        <input type="number" id="profitRate" value="15" step="1">
                        <div class="inline-hint">报价公式：总成本 × (1 + 利润率)</div>
                    </div>
                </div>

                <!-- 实时报价预览 -->
                <div class="preview-card" id="previewArea">
                    <span class="preview-label">💰 当前参考报价</span>
                    <span class="preview-price" id="liveQuoteAmount">0.00 ¥</span>
                </div>
                <button class="btn-save" id="saveQuoteBtn">📌 保存本次报价记录</button>
            </div>
        </div>

        <!-- 右侧报价记录区域 -->
        <div class="history-panel">
            <div class="card-header">
                <h2>📋 报价记录册</h2>
                <span style="font-size:0.7rem; color:#4b6b8f;">每次报价自动存档</span>
            </div>
            <div class="card-body" style="padding-top: 0.5rem; flex:1; display:flex; flex-direction:column;">
                <div id="recordsContainer" class="record-list">
                    <!-- 动态记录列表 -->
                    <div class="empty-record">暂无报价记录，填写参数后点击「保存报价记录」</div>
                </div>
                <button id="clearAllRecords" class="clear-btn">🗑️ 清空所有记录</button>
            </div>
        </div>
    </div>
</div>

<!-- 详情模态框 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; align-items:center;">
            <h3>📄 报价详情快照</h3>
            <button class="close-modal" id="closeModalBtn">关闭</button>
        </div>
        <div id="modalDetailBody"></div>
    </div>
</div>

<script>
    // ---------- DOM 元素绑定 ----------
    // 报价类型 radios
    const radioCIF = document.querySelector('input[value="CIF"]');
    const radioDDP = document.querySelector('input[value="DDP"]');
    const dutySection = document.getElementById('dutySection');
    
    // 输入框
    const goodsCost = document.getElementById('goodsCost');
    const freight = document.getElementById('freight');
    const insurance = document.getElementById('insurance');
    // 国内细分
    const factoryToPort = document.getElementById('factoryToPort');
    const airportFee = document.getElementById('airportFee');
    const trucking = document.getElementById('trucking');
    const customsFee = document.getElementById('customsFee');
    const documentFee = document.getElementById('documentFee');
    const portSurcharge = document.getElementById('portSurcharge');
    // 关税税率
    const importDutyRate = document.getElementById('importDutyRate');
    const importVatRate = document.getElementById('importVatRate');
    // 利润率
    const profitRate = document.getElementById('profitRate');
    
    // 预览 & 保存按钮
    const liveQuoteSpan = document.getElementById('liveQuoteAmount');
    const saveBtn = document.getElementById('saveQuoteBtn');
    const clearBtn = document.getElementById('clearAllRecords');
    const recordsContainer = document.getElementById('recordsContainer');
    
    // 模态框相关
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalDetailBody');
    const closeModalBtn = document.getElementById('closeModalBtn');
    
    // 全局存储报价记录 (localStorage)
    let quoteRecords = [];
    
    // ========== 辅助函数 ==========
    // 获取国内总费用 (细分求和)
    function getDomesticTotal() {
        const val = (v) => parseFloat(v) || 0;
        return val(factoryToPort.value) + val(airportFee.value) + val(trucking.value) + 
               val(customsFee.value) + val(documentFee.value) + val(portSurcharge.value);
    }
    
    // 获取CIF价值 (货物成本 + 国内总费用 + 国际运费 + 保险费)
    function getCifValue() {
        const goods = parseFloat(goodsCost.value) || 0;
        const freightVal = parseFloat(freight.value) || 0;
        const insuranceVal = parseFloat(insurance.value) || 0;
        const domestic = getDomesticTotal();
        return goods + domestic + freightVal + insuranceVal;
    }
    
    // 获取关税和增值税 (仅DDP时，基于CIF价值)
    function getDDPTaxes(cifValue) {
        const dutyRate = (parseFloat(importDutyRate.value) || 0) / 100;
        const vatRate = (parseFloat(importVatRate.value) || 0) / 100;
        const dutyAmount = cifValue * dutyRate;
        const vatAmount = (cifValue + dutyAmount) * vatRate;
        return { dutyAmount, vatAmount };
    }
    
    // 获取当前报价类型 (CIF / DDP)
    function getCurrentQuoteType() {
        return radioCIF.checked ? 'CIF' : 'DDP';
    }
    
    // 核心计算：返回 { totalCostBase, finalQuote, detailBreakdown }
    function computeQuoteDetails() {
        const type = getCurrentQuoteType();
        const cifValue = getCifValue();
        let totalCostBase = cifValue;  // 初始成本基准 = CIF价值
        let duty = 0, vat = 0;
        let breakdownExtra = {};
        
        if (type === 'DDP') {
            const taxes = getDDPTaxes(cifValue);
            duty = taxes.dutyAmount;
            vat = taxes.vatAmount;
            totalCostBase = cifValue + duty + vat;
            breakdownExtra = { duty, vat };
        }
        
        const profitPercent = (parseFloat(profitRate.value) || 0) / 100;
        const finalQuote = totalCostBase * (1 + profitPercent);
        // 利润额
        const profitAmount = totalCostBase * profitPercent;
        
        return {
            quoteType: type,
            cifValue: cifValue,
            domesticTotal: getDomesticTotal(),
            goodsCost: parseFloat(goodsCost.value) || 0,
            freight: parseFloat(freight.value) || 0,
            insurance: parseFloat(insurance.value) || 0,
            totalCostBase: totalCostBase,
            profitRateNum: parseFloat(profitRate.value) || 0,
            profitAmount: profitAmount,
            finalQuote: finalQuote,
            dutyAmount: duty,
            vatAmount: vat,
            // 细分项快照（方便详情展示）
            domesticItems: {
                factoryToPort: parseFloat(factoryToPort.value) || 0,
                airportFee: parseFloat(airportFee.value) || 0,
                trucking: parseFloat(trucking.value) || 0,
                customsFee: parseFloat(customsFee.value) || 0,
                documentFee: parseFloat(documentFee.value) || 0,
                portSurcharge: parseFloat(portSurcharge.value) || 0
            },
            dutyRate: parseFloat(importDutyRate.value) || 0,
            vatRate: parseFloat(importVatRate.value) || 0,
        };
    }
    
    // 更新页面上的实时报价预览
    function updatePreview() {
        const details = computeQuoteDetails();
        liveQuoteSpan.innerText = details.finalQuote.toFixed(2) + ' ¥';
        return details;
    }
    
    // 监听所有输入变化, 实时更新预览
    function bindInputEvents() {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(inp => {
            inp.addEventListener('input', () => {
                updatePreview();
                // 如果DDP区域隐藏但税率输入依然可用，没问题
            });
        });
        // 类型切换时刷新预览 + 显示隐藏关税区域
        radioCIF.addEventListener('change', () => {
            toggleDutySection();
            updatePreview();
        });
        radioDDP.addEventListener('change', () => {
            toggleDutySection();
            updatePreview();
        });
    }
    
    // 显示/隐藏关税增值税区域 (DDP显示)
    function toggleDutySection() {
        const isDDP = getCurrentQuoteType() === 'DDP';
        dutySection.style.display = isDDP ? 'block' : 'none';
    }
    
    // 保存当前报价到记录 (localStorage)
    function saveCurrentQuoteToHistory() {
        // 获取完整报价细节
        const quoteData = computeQuoteDetails();
        const now = new Date();
        const timestamp = now.toLocaleString('zh-CN', { hour12: false });
        const iso = now.toISOString();
        
        // 构建记录对象 (包含快照)
        const record = {
            id: Date.now() + Math.random().toString(36).substring(2, 6),
            timestamp: timestamp,
            iso: iso,
            quoteType: quoteData.quoteType,
            finalQuote: quoteData.finalQuote,
            profitRate: quoteData.profitRateNum,
            // 完整快照
            snapshot: {
                goodsCost: quoteData.goodsCost,
                domesticTotal: quoteData.domesticTotal,
                domesticItems: { ...quoteData.domesticItems },
                freight: quoteData.freight,
                insurance: quoteData.insurance,
                cifValue: quoteData.cifValue,
                totalCostBase: quoteData.totalCostBase,
                profitAmount: quoteData.profitAmount,
                dutyAmount: quoteData.dutyAmount,
                vatAmount: quoteData.vatAmount,
                dutyRate: quoteData.dutyRate,
                vatRate: quoteData.vatRate,
                profitPercent: quoteData.profitRateNum
            }
        };
        
        quoteRecords.unshift(record);  // 最新在上方
        saveRecordsToLocal();
        renderRecordsList();
        // 可选轻提示
        showTemporaryToast('✅ 报价已存档');
    }
    
    // 显示临时通知 (极简)
    function showTemporaryToast(msg) {
        let toast = document.createElement('div');
        toast.innerText = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.backgroundColor = '#1e293b';
        toast.style.color = 'white';
        toast.style.padding = '8px 18px';
        toast.style.borderRadius = '40px';
        toast.style.fontSize = '0.85rem';
        toast.style.zIndex = '999';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
        document.body.appendChild(toast);
        setTimeout(() => { toast.remove(); }, 1800);
    }
    
    // 保存到localStorage
    function saveRecordsToLocal() {
        localStorage.setItem('quoteHistory', JSON.stringify(quoteRecords));
    }
    
    // 加载历史记录
    function loadRecordsFromLocal() {
        const stored = localStorage.getItem('quoteHistory');
        if (stored) {
            try {
                quoteRecords = JSON.parse(stored);
            } catch(e) { quoteRecords = []; }
        } else {
            quoteRecords = [];
        }
        renderRecordsList();
    }
    
    // 渲染右侧记录列表
    function renderRecordsList() {
        if (!recordsContainer) return;
        if (quoteRecords.length === 0) {
            recordsContainer.innerHTML = '<div class="empty-record">📭 暂无报价记录，点击「保存报价记录」开始追溯</div>';
            return;
        }
        let html = '';
        quoteRecords.forEach(rec => {
            const quoteVal = rec.finalQuote.toFixed(2);
            const typeIcon = rec.quoteType === 'CIF' ? '🚢 CIF' : '🏭 DDP';
            html += `
                <div class="record-item" data-id="${rec.id}">
                    <div class="record-header">
                        <span class="record-type">${typeIcon}</span>
                        <span class="record-date">📅 ${rec.timestamp}</span>
                    </div>
                    <div class="record-amount">💰 ${quoteVal} ¥</div>
                    <div class="record-actions">
                        <button class="icon-btn view-detail" data-id="${rec.id}">🔍 查看详情</button>
                        <button class="icon-btn delete-record" data-id="${rec.id}">🗑️ 删除</button>
                    </div>
                </div>
            `;
        });
        recordsContainer.innerHTML = html;
        
        // 绑定详情和删除事件
        document.querySelectorAll('.view-detail').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                const record = quoteRecords.find(r => r.id == id);
                if (record) showDetailModal(record);
            });
        });
        document.querySelectorAll('.delete-record').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                deleteRecordById(id);
            });
        });
    }
    
    // 删除单条记录
    function deleteRecordById(id) {
        quoteRecords = quoteRecords.filter(rec => rec.id != id);
        saveRecordsToLocal();
        renderRecordsList();
        showTemporaryToast('已删除一条记录');
    }
    
    // 清空所有记录
    function clearAllRecords() {
        if (quoteRecords.length > 0 && confirm('⚠️ 确定要清空全部报价历史吗？数据不可恢复。')) {
            quoteRecords = [];
            saveRecordsToLocal();
            renderRecordsList();
            showTemporaryToast('所有记录已清空');
        }
    }
    
    // 显示详情模态框
    function showDetailModal(record) {
        const snap = record.snapshot;
        if (!snap) return;
        const domesticItems = snap.domesticItems || {};
        const isDDPRecord = record.quoteType === 'DDP';
        let taxHtml = '';
        if (isDDPRecord) {
            taxHtml = `
                <div class="detail-grid">
                    <span>关税金额:</span><span>${(snap.dutyAmount || 0).toFixed(2)} ¥</span>
                    <span>增值税金额:</span><span>${(snap.vatAmount || 0).toFixed(2)} ¥</span>
                    <span>关税税率:</span><span>${(snap.dutyRate || 0)}%</span>
                    <span>增值税率:</span><span>${(snap.vatRate || 0)}%</span>
                </div>
            `;
        }
        
        const detailHtml = `
            <div class="detail-grid">
                <span>报价类型:</span><span><strong>${record.quoteType}</strong></span>
                <span>最终报价:</span><span style="font-weight:800;">${record.finalQuote.toFixed(2)} ¥</span>
                <span>利润率:</span><span>${snap.profitPercent || record.profitRate}%</span>
                <span>货物总成本:</span><span>${snap.goodsCost.toFixed(2)} ¥</span>
                <span>国内费用合计:</span><span>${snap.domesticTotal.toFixed(2)} ¥</span>
                <span style="font-size:0.75rem; color:#334155;">↳ 工厂→港:${domesticItems.factoryToPort || 0} 机场:${domesticItems.airportFee||0} 拖车:${domesticItems.trucking||0} 报关:${domesticItems.customsFee||0} 文件:${domesticItems.documentFee||0} 港杂:${domesticItems.portSurcharge||0}</span>
                <span>国际运费:</span><span>${snap.freight.toFixed(2)} ¥</span>
                <span>保险费:</span><span>${snap.insurance.toFixed(2)} ¥</span>
                <span>CIF价值:</span><span>${snap.cifValue.toFixed(2)} ¥</span>
                <span>成本基数(税前):</span><span>${snap.totalCostBase.toFixed(2)} ¥</span>
                <span>利润金额:</span><span>${snap.profitAmount.toFixed(2)} ¥</span>
            </div>
            ${taxHtml ? `<hr>${taxHtml}` : ''}
            <hr>
            <div style="font-size:0.75rem; margin-top:8px;">⏱️ 报价时间: ${record.timestamp}</div>
        `;
        modalBody.innerHTML = detailHtml;
        modal.style.display = 'flex';
    }
    
    // 关闭模态框
    function closeModal() {
        modal.style.display = 'none';
    }
    
    // 初始化加载: 加载记录, 同步预览, 绑定事件
    function init() {
        loadRecordsFromLocal();
        toggleDutySection();
        updatePreview();
        bindInputEvents();
        // 保存按钮事件
        saveBtn.addEventListener('click', () => {
            saveCurrentQuoteToHistory();
        });
        clearBtn.addEventListener('click', clearAllRecords);
        // 模态关闭
        closeModalBtn.addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        // 额外监听一下关税显示第一次载入时
        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('change', updatePreview);
        });
    }
    
    init();
</script>
</body>
</html>
